<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>voyeurism</title>
  <style>img { width: 100%; }</style>
</head>
<body>
    <div class="topbar">
      <a href="index.html">← Back</a>

      <h1>voyeurism</h1>

    <div class="gallery" id="gallery">
      <p class="note">peeping…</p>
    </div>

    <script>
      const USER   = "sicklepot";
      const REPO   = "sicklepot.github.io";
      const FOLDER = "images/voyeurism";
      const api = "https://api.github.com/repos/" + USER + "/" + REPO + "/contents/" + FOLDER;
      const box = document.getElementById("gallery");

      fetch(api)
        .then(function (r) { return r.json(); })
        .then(function (files) {
          if (!Array.isArray(files)) { box.innerHTML = ""; return; }
          var imgs = files
            .filter(function (f) { return /\.(jpe?g|png|gif|webp|avif)$/i.test(f.name); })
            .sort(function (a, b) { return a.name.localeCompare(b.name, undefined, {numeric: true}); });
          box.innerHTML = "";
          imgs.forEach(function (f) {
            var img = document.createElement("img");
            img.src = f.download_url;
            img.loading = "lazy";
            img.alt = "";
            box.appendChild(img);
          });
        })
        .catch(function () { box.innerHTML = ""; });
    </script>

  </div>
</body>
</html>
